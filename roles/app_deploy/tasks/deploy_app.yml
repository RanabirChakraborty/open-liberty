---
# app_deploy – deploy_app.yml
# Handles one application item from openliberty_applications.

- name: Set deployment facts for application
  ansible.builtin.set_fact:
    _app_state: "{{ _app.state | default('present') }}"
    _app_type: "{{ _app.type | default(_app.src | regex_replace('.*\\.', '')) }}"
    _app_src: "{{ _app.src }}"
    _app_filename: "{{ _app.src | basename }}"

- name: Determine destination path for application
  ansible.builtin.set_fact:
    _app_dest: "{{ _openliberty_deploy_dest_dir }}/{{ _app_filename }}"

- name: Remove application archive
  ansible.builtin.file:
    path: "{{ _app_dest }}"
    state: absent
  become: true
  when: _app_state == 'absent'
  notify: Restart Open Liberty service

- name: Copy application archive from controller or managed node
  ansible.builtin.copy:
    src: "{{ _app_src }}"
    dest: "{{ _app_dest }}"
    remote_src: "{{ _app.remote_src | default(false) | bool }}"
    owner: "{{ openliberty_user }}"
    group: "{{ openliberty_group }}"
    mode: "0640"
    backup: "{{ openliberty_deploy_backup | bool }}"
  become: true
  register: _app_copy_result
  when:
    - _app_state == 'present'
    - _app_src is not match('^https?://')
  notify: Restart Open Liberty service

- name: Download application archive from URL (with checksum)
  ansible.builtin.get_url:
    url: "{{ _app_src }}"
    dest: "{{ _app_dest }}"
    checksum: "{{ _app.checksum }}"
    owner: "{{ openliberty_user }}"
    group: "{{ openliberty_group }}"
    mode: "0640"
    timeout: 120
    backup: "{{ openliberty_deploy_backup | bool }}"
  become: true
  register: _app_download_checksum_result
  when:
    - _app_state == 'present'
    - _app_src is match('^https?://')
    - _app.checksum is defined
  notify: Restart Open Liberty service

- name: Download application archive from URL (without checksum)
  ansible.builtin.get_url:
    url: "{{ _app_src }}"
    dest: "{{ _app_dest }}"
    owner: "{{ openliberty_user }}"
    group: "{{ openliberty_group }}"
    mode: "0640"
    timeout: 120
    backup: "{{ openliberty_deploy_backup | bool }}"
  become: true
  register: _app_download_result
  when:
    - _app_state == 'present'
    - _app_src is match('^https?://')
    - _app.checksum is not defined
  notify: Restart Open Liberty service

# copy/get_url only create a backup when the archive content changed; rename it
# to the documented <archive>.<timestamp>.bak convention.
- name: Rename backup of replaced archive to timestamped .bak
  ansible.builtin.command:
    cmd: >-
      mv {{ _app_backup_file | quote }}
      {{ (_app_dest ~ '.' ~ ansible_date_time.iso8601_basic_short ~ '.bak') | quote }}
  become: true
  changed_when: true
  loop: >-
    {{ [_app_copy_result | default({}), _app_download_checksum_result | default({}),
        _app_download_result | default({})]
       | selectattr('backup_file', 'defined') | map(attribute='backup_file') | list }}
  loop_control:
    loop_var: _app_backup_file
  when: _app_state == 'present'
